<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h1>My Doctor's Appointment</h1>
    <hr>
    <form>
        <fieldset>
<legend>Personal Details</legend>
<label>Your Name</label><br>
<input type="text" placeholder="full name"><br><br>
<label>Your Email</label><br>
<input type="email" placeholder="Email"><br><br>
<label>Your Phone number</label><br>
<input type="number" placeholder="Number"><br><br>
<label>Date of Birth</label><br>
<input type="date" placeholder="dob"><br><br>
<label>Choose your Doctor</label><br>
<select id="Doctor>
    <option value="">-- Select a doctor --</option>
    <option value="dr-ray">Dr. Ray - General</option>
    <option value="dr-lee">Dr. Lee - Teeth</option>
    <option value="dr-sam">Dr. Sam - Brain</option>
    </select><br><br>
    <h4>Preferred Visit Day</h4>
    <input type="checkbox" value="mon"> Monday<br>
    <input type="checkbox" value="wed"> Wednesday<br>
    <input type="checkbox" value="fri"> Friday<br>
        </fieldset>
        <br>
        <input type="submit" value="Book My Appointment">
    </form>

    </body>
</html>
